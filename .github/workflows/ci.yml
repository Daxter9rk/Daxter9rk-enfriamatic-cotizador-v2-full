name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

env:
  VITE_FIREBASE_API_KEY: demo-api-key
  VITE_FIREBASE_AUTH_DOMAIN: demo-enfriamatic.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: demo-enfriamatic
  VITE_FIREBASE_STORAGE_BUCKET: demo-enfriamatic.appspot.com
  VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
  VITE_FIREBASE_APP_ID: '1:000000000000:web:e2e'
  VITE_USE_EMULATORS: 'true'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm --prefix functions run validate
      - run: npm run audit:all

  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npx playwright install --with-deps chromium
      - name: Validate emulator suite
        run: npm run validate:emulators
